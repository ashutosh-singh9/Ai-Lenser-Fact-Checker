<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="AI LENSER - Intelligent Fake News Detection powered by AI. Verify news authenticity instantly.">
    <title>AI LENSER - Verify the World Around You</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Port+Lligat+Sans&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="dark-mode">
    <!-- Animated Background -->
    <div class="bg-animation">
        <div class="bg-gradient"></div>
        <div class="bg-grid"></div>
    </div>

    <!-- Side Panel - Minimal Design -->
    <aside class="side-panel" id="sidePanel">
        <!-- Close Button -->
        <button class="panel-close" id="panelClose">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>

        <!-- Product Name -->
        <div class="sidebar-brand">
            <h1 class="brand-name">AI LENSER</h1>
        </div>

        <!-- Navigation Menu -->
        <nav class="sidebar-nav">
            <a href="index.html" class="nav-item active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" />
                    <path d="M9 22V12h6v10" />
                </svg>
                <span>Home</span>
            </a>
            <a href="news.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path
                        d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V9a2 2 0 012-2h2a2 2 0 012 2v9a2 2 0 01-2 2h-2z" />
                    <path d="M7 8h6M7 12h6M7 16h4" />
                </svg>
                <span>Latest News</span>
            </a>
            <a href="history.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10" />
                    <path d="M12 6v6l4 2" />
                </svg>
                <span>History</span>
            </a>
        </nav>

        <!-- Bottom Section: Extension Link -->
        <div class="sidebar-footer">
            <a href="#" class="extension-link" id="extensionLink">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3" />
                </svg>
                <span>Get Extension</span>
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Header -->
        <header class="header">
            <button class="menu-btn" id="menuBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 12h18M3 6h18M3 18h18" />
                </svg>
            </button>

            <div class="header-center">
                <span class="mobile-logo">AI LENSER</span>
            </div>

            <div class="header-right">
                <button class="theme-toggle" id="themeToggle" title="Toggle Theme">
                    <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5" />
                        <path
                            d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
                    </svg>
                    <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" />
                    </svg>
                </button>
            </div>
        </header>

        <!-- Hero Section -->
        <section class="hero">
            <div class="hero-content">
                <h2 class="hero-title">
                    <span class="gradient-text">AI LENSER</span>
                </h2>
                <p class="hero-subtitle">Verify the world around you</p>

                <!-- Stats Cards -->
                <div class="stats-container">
                    <div class="stat-card verified">
                        <div class="stat-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 11.08V12a10 10 0 11-5.93-9.14" />
                                <path d="M22 4L12 14.01l-3-3" />
                            </svg>
                        </div>
                        <div class="stat-info">
                            <span class="stat-label">Verified</span>
                            <span class="stat-value" id="verifiedCount">0</span>
                        </div>
                    </div>
                    <div class="stat-card fake">
                        <div class="stat-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10" />
                                <path d="M15 9l-6 6M9 9l6 6" />
                            </svg>
                        </div>
                        <div class="stat-info">
                            <span class="stat-label">Fake</span>
                            <span class="stat-value" id="fakeCount">0</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Input Section -->
        <section class="input-section">
            <div class="input-card glass-card">
                <!-- Input Type Tabs -->
                <div class="input-tabs">
                    <button class="tab-btn active" data-tab="text">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" />
                            <path d="M14 2v6h6M16 13H8M16 17H8M10 9H8" />
                        </svg>
                        Text / URL
                    </button>
                    <button class="tab-btn" data-tab="image">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2" />
                            <circle cx="8.5" cy="8.5" r="1.5" />
                            <path d="M21 15l-5-5L5 21" />
                        </svg>
                        Image
                    </button>
                </div>

                <!-- Text Input Tab -->
                <div class="tab-content active" id="textTab">
                    <div class="input-wrapper">
                        <textarea id="newsInput" class="news-input"
                            placeholder="Paste news headline, article text, or URL here..." rows="5"></textarea>
                        <button class="mic-btn" id="micBtn" title="Voice Input">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z" />
                                <path d="M19 10v2a7 7 0 01-14 0v-2" />
                                <path d="M12 19v4M8 23h8" />
                            </svg>
                            <div class="mic-pulse"></div>
                        </button>
                    </div>
                    <div class="listening-indicator" id="listeningIndicator">
                        <div class="listening-animation">
                            <span></span><span></span><span></span><span></span><span></span>
                        </div>
                        <p>Listening...</p>
                    </div>
                </div>

                <!-- Image Input Tab -->
                <div class="tab-content" id="imageTab">
                    <div class="image-upload-area" id="imageUploadArea">
                        <input type="file" id="imageInput" accept="image/*" hidden>
                        <div class="upload-content">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" />
                                <path d="M17 8l-5-5-5 5" />
                                <path d="M12 3v12" />
                            </svg>
                            <p>Drop image here or <span>browse</span></p>
                            <small>Supports: JPG, PNG, GIF, WebP</small>
                        </div>
                        <div class="image-preview" id="imagePreview">
                            <img id="previewImg" src="" alt="Preview">
                            <button class="remove-image" id="removeImage">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="12" cy="12" r="10" />
                                    <path d="M15 9l-6 6M9 9l6 6" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Verify Button -->
                <button class="verify-btn" id="verifyBtn">
                    <span class="btn-text">Verify Now</span>
                    <span class="btn-loader">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10" opacity="0.25" />
                            <path d="M12 2a10 10 0 0110 10" stroke-linecap="round" />
                        </svg>
                    </span>
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8" />
                        <path d="M21 21l-4.35-4.35" />
                    </svg>
                </button>
            </div>
        </section>

        <!-- Result Section -->
        <section class="result-section" id="resultSection">
            <div class="result-card glass-card">
                <div class="result-header">
                    <h3>Analysis Result</h3>
                    <span class="result-badge" id="resultBadge">Analyzing...</span>
                </div>

                <!-- Trust Meter -->
                <div class="trust-meter-container">
                    <div class="trust-meter">
                        <div class="meter-bg">
                            <div class="meter-fill" id="meterFill"></div>
                        </div>
                        <div class="meter-needle" id="meterNeedle"></div>
                    </div>
                    <div class="trust-score">
                        <span class="score-value" id="trustScore">0</span>
                        <span class="score-label">Trust Score</span>
                    </div>
                    <div class="trust-labels">
                        <span class="label-fake">FAKE</span>
                        <span class="label-uncertain">UNCERTAIN</span>
                        <span class="label-real">AUTHENTIC</span>
                    </div>
                </div>

                <!-- Result Details -->
                <div class="result-details" id="resultDetails">
                    <div class="detail-item">
                        <span class="detail-label">Verdict</span>
                        <span class="detail-value" id="verdictText">-</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Confidence</span>
                        <span class="detail-value" id="confidenceText">-</span>
                    </div>
                    <div class="detail-item analysis">
                        <span class="detail-label">Analysis</span>
                        <p class="detail-value" id="analysisText">-</p>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="result-actions">
                    <button class="action-btn share-btn" id="shareBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="18" cy="5" r="3" />
                            <circle cx="6" cy="12" r="3" />
                            <circle cx="18" cy="19" r="3" />
                            <path d="M8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98" />
                        </svg>
                        Share
                    </button>
                    <button class="action-btn new-check-btn" id="newCheckBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 5v14M5 12h14" />
                        </svg>
                        New Check
                    </button>
                </div>
            </div>
        </section>
    </main>

    <!-- Overlay for mobile side panel -->
    <div class="panel-overlay" id="panelOverlay"></div>

    <script src="script.js"></script>
</body>

</html>
